name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # For comparing a pull request with its base.
          fetch-depth: 0

      - uses: actions/checkout@v7
        with:
          repository: snktibor/cronchords
          path: .cronchords
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

      - name: Check the files people change
        run: python -m mapper check
        env:
          PYTHONPATH: .cronchords/worker

      - name: Leave the generated files alone
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE"...HEAD -- data state ':(exclude)data/LICENSE')
          if [ -n "$changed" ]; then
            echo "::error::The Update workflow writes data/ and state/, please leave these out:"
            echo "$changed"
            exit 1
          fi
