name: Update

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

# Two runs at once would both commit.
concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # Commits data/ and state/.
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The matching rules the pairs are verified with.
      - uses: actions/checkout@v7
        with:
          repository: snktibor/cronchords
          path: .cronchords
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect and verify the shared pairs
        run: python -m mapper update
        env:
          PYTHONPATH: .cronchords/worker
          GITHUB_TOKEN: ${{ github.token }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Commit the changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data state
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git commit -m "Update the pairs"
          git push
