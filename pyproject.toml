[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".cronchords"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-third-party = ["cronchords"]

[tool.pytest.ini_options]
# cronchords' matching rules, from a clone of it in .cronchords (see the README).
pythonpath = [".", ".cronchords/worker", "tests"]
testpaths = ["tests"]
